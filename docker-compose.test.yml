services:

  db-test:
    image: timescale/timescaledb:2.27.1-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
    container_name: pulsebase-db-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: garmin_test
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-internal

  flyway-test:
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: pulsebase-flyway-test
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db-test:5432/garmin_test
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
      - FLYWAY_PLACEHOLDERS_DB_APP_USER=${DB_APP_USER}
      - FLYWAY_PLACEHOLDERS_DB_APP_PASSWORD=${DB_APP_PASSWORD}
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test-internal

  api-test:
    build: ./api
    container_name: pulsebase-api-test
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - env/.env.app
      - env/.env.api
    environment:
      DB_HOST: db-test
      DB_PORT: 5432
      DB_NAME: garmin_test
      HTTPS_ONLY: "false"
      RESEND_API_KEY: ""
    depends_on:
      flyway-test:
        condition: service_completed_successfully
    networks:
      - test-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  test-internal:
    driver: bridge
