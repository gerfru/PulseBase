[project]
name = "garmin-api"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.1",
    "garminconnect>=0.3.3",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
    "pylibrelinkup>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "playwright>=1.52.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["src/db.py", "src/training_load.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
