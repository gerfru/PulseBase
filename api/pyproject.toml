[project]
name = "pulsebase-api"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1,!=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.1",
    "garminconnect>=0.3.3",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "resend>=2.0.0",
    "slowapi>=0.1.9",
    "pylibrelinkup>=0.10.0",
    "cryptography>=42.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "psutil>=6.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "playwright>=1.52.0",
    "axe-playwright-python>=0.1.7",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
]
fail_under = 75
