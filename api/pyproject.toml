[project]
name = "garmin-api"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.28",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.14.0",
    "garminconnect>=0.3.3",
    "bcrypt>=5.0.0",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
    "pylibrelinkup>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
