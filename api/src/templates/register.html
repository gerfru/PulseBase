<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBase — Registrieren</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrap">
        <h1 class="auth-brand">PulseBase</h1>
        <p class="auth-sub">Neues Konto erstellen</p>

        <div class="card">
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required autofocus placeholder="z.B. Gerald" autocomplete="name">

                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" required autocomplete="email">

                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
                <p class="hint">Mindestens 8 Zeichen</p>

                <label for="password_confirm">Passwort bestätigen</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password">

                <button class="btn btn-primary btn-block" type="submit" style="margin-top: var(--sp-6)">Konto erstellen</button>
            </form>
        </div>

        <p class="auth-footer">Bereits ein Konto? <a href="/login">Anmelden</a></p>
    </div>
</body>
</html>
