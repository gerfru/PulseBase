<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Account verknüpfen</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; color: #333; }
        .card { background: #f8f9fa; border-radius: 12px; padding: 32px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #374151; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 20px; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #e5e7eb; color: #374151; text-decoration: none; display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 8px; }
        .error { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem; }
        .notice { background: #eff6ff; color: #1e40af; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.9rem; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Garmin Account verknüpfen</h1>

    <div class="card">
        <div class="notice">
            Dein Passwort wird <strong>nicht gespeichert</strong>. Es wird einmalig für den Login
            verwendet, danach nur noch ein Token gespeichert.
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/garmin/link">
            <label for="garmin_email">Garmin Connect E-Mail</label>
            <input type="email" id="garmin_email" name="garmin_email" required autocomplete="email" placeholder="deine@email.com">

            <label for="garmin_password">Garmin Connect Passwort</label>
            <input type="password" id="garmin_password" name="garmin_password" required autocomplete="current-password">

            <button class="btn btn-primary" type="submit">Verknüpfen</button>
        </form>

        <a class="btn-secondary" href="/">Abbrechen</a>
    </div>
</body>
</html>
