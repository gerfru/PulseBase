<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBase — Garmin verknüpfen</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrap" style="max-width: 480px;">
        <h1 class="auth-brand">Garmin Account verknüpfen</h1>
        <p class="auth-sub">Für {{ user.name }}</p>

        <div class="card">
            <div class="notice">
                Dein Passwort wird <strong>nicht gespeichert</strong>. Es wird einmalig für den
                Login verwendet, danach nur noch ein Token gespeichert.
            </div>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/garmin/link">
                <label for="garmin_email">Garmin Connect E-Mail</label>
                <input type="email" id="garmin_email" name="garmin_email" required autocomplete="email" placeholder="deine@email.com">

                <label for="garmin_password">Garmin Connect Passwort</label>
                <input type="password" id="garmin_password" name="garmin_password" required autocomplete="current-password">

                <button class="btn btn-primary btn-block" type="submit" style="margin-top: var(--sp-6)">Verknüpfen</button>
            </form>

            <a class="btn btn-secondary btn-block" href="/" style="margin-top: var(--sp-3)">Abbrechen</a>
        </div>
    </div>
</body>
</html>
