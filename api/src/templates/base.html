<!DOCTYPE html>
<html lang="de" class="antialiased dark" {% block body_attrs %}{% endblock %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PulseBase{% endblock %}</title>
    <script src="/static/theme-init.js?v={{ v }}"></script>
    <link rel="stylesheet" href="/static/tailwind.min.css?v={{ v }}">
    <link rel="stylesheet" href="/static/style.css?v={{ v }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-200">
    {% block content %}{% endblock %}
    <footer class="mt-8 pb-6 text-center text-xs text-slate-500 dark:text-slate-600 space-x-3">
        <a href="/privacy" class="hover:text-slate-400 transition-colors">Datenschutz</a>
        <span>·</span>
        <a href="/terms" class="hover:text-slate-400 transition-colors">Nutzungsbedingungen</a>
        <span>·</span>
        <a href="/imprint" class="hover:text-slate-400 transition-colors">Impressum</a>
        <span>·</span>
        <a href="/accessibility" class="hover:text-slate-400 transition-colors">Barrierefreiheit</a>
    </footer>

    <script src="/static/colors.js?v={{ v }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
