<!DOCTYPE html>
<html lang="de" class="antialiased dark" {% block body_attrs %}{% endblock %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PulseBase{% endblock %}</title>
    <script src="/static/theme-init.js?v={{ v }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/tailwind.min.css?v={{ v }}">
    <link rel="stylesheet" href="/static/style.css?v={{ v }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-200">
    {% block content %}{% endblock %}
    <footer class="mt-8 pb-6 text-center text-xs text-slate-500 dark:text-slate-600 space-x-3">
        <a href="/privacy" class="hover:text-slate-400 transition-colors">Datenschutz</a>
        <span>·</span>
        <a href="/terms" class="hover:text-slate-400 transition-colors">Nutzungsbedingungen</a>
        <span>·</span>
        <a href="/imprint" class="hover:text-slate-400 transition-colors">Impressum</a>
        <span>·</span>
        <a href="/accessibility" class="hover:text-slate-400 transition-colors">Barrierefreiheit</a>
    </footer>

    {% set _ap = active_page if active_page is defined else '' %}
    <!-- Persistente Bottom-Nav (Mobile only — sm:hidden handled via CSS) -->
    <nav class="bottom-nav" aria-label="Hauptnavigation">
        <a href="/dashboard" class="nav-bottom-item{% if _ap == 'dashboard' %} active{% endif %}" aria-label="Heute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Heute</span>
        </a>
        <a href="/metrics" class="nav-bottom-item{% if _ap == 'metrics' %} active{% endif %}" aria-label="Metriken">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Metriken</span>
        </a>
        <a href="/dashboard#training" class="nav-bottom-item{% if _ap == 'training' %} active{% endif %}" aria-label="Training">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span>Training</span>
        </a>
        <a href="/settings" class="nav-bottom-item{% if _ap == 'settings' %} active{% endif %}" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Einstellungen</span>
        </a>
    </nav>
    <!-- Spacer damit Content nicht unter Bottom-Nav verschwindet -->
    <div class="bottom-nav-spacer" aria-hidden="true"></div>

    <script src="/static/colors.js?v={{ v }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
