<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBase — {{ title }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-section="{{ section }}">

    <div class="act-header card">
        <a class="act-back" href="/dashboard">← Dashboard</a>
        <h1 class="act-title">{{ title }}</h1>
    </div>

    <div class="content">

        <!-- Ruhepuls Anomalie -->
        <div class="card full" id="anomaly-card" style="display:none">
            <div class="ml-stat-grid" id="anomaly-stats"></div>
            <div class="chart-wrap"><canvas id="anomaly-chart"></canvas></div>
        </div>

        <!-- Readiness Prognose -->
        <div class="card full" id="rf-card" style="display:none">
            <div class="ml-stat-grid" id="rf-stats"></div>
            <div class="chart-wrap" style="margin-bottom:var(--sp-5)"><canvas id="rf-chart"></canvas></div>
            <div id="rf-importance" style="display:none">
                <h2 style="margin-bottom:var(--sp-3)">Feature Importance</h2>
                <div class="chart-wrap" style="max-height:160px"><canvas id="importance-chart"></canvas></div>
                <div id="rf-meta" style="margin-top:var(--sp-3)"></div>
            </div>
        </div>

        <!-- Korrelationen -->
        <div class="card full" id="corr-card" style="display:none">
            <div id="corr-items"></div>
        </div>

        <!-- Body Battery Muster -->
        <div class="card full" id="bp-card" style="display:none">
            <div id="bp-content"></div>
        </div>

    </div>

    <script src="/static/ml_insights.js"></script>
</body>
</html>
