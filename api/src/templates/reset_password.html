{% extends "base.html" %}
{% block title %}PulseBase — Neues Passwort setzen{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100 mb-1">PulseBase</h1>
    <p class="text-slate-600 dark:text-slate-400 text-sm mb-8">Neues Passwort setzen</p>

    <div class="w-full max-w-sm">
        <div class="card card-form">
            {% if error %}
            <div role="alert" class="mb-4 px-4 py-3 rounded-xl bg-red-500/15 border border-red-500/25 text-red-300 text-sm">{{ error }}</div>
            {% endif %}

            <form method="post" action="/auth/reset/{{ token }}" class="flex flex-col gap-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Neues Passwort</label>
                    <input type="password" id="password" name="password" required autofocus autocomplete="new-password"
                           class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-900/60 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-400 transition-colors">
                    <p class="mt-1.5 text-xs text-slate-600 dark:text-slate-400">Mindestens 8 Zeichen</p>
                </div>
                <div>
                    <label for="password_confirm" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Passwort bestätigen</label>
                    <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password"
                           class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-slate-900/60 border border-slate-300 dark:border-white/10 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-400 transition-colors">
                </div>
                <button type="submit"
                        class="mt-1 w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 text-sm font-semibold transition-colors">
                    Passwort setzen
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
