<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #333; }
        .card { background: #f8f9fa; border-radius: 12px; padding: 32px; margin: 24px 0; }
        .status { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.green { background: #22c55e; }
        .dot.grey { background: #94a3b8; }
        .btn { display: inline-block; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-size: 0.95rem; border: none; cursor: pointer; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        h1 { font-size: 1.6rem; margin-bottom: 4px; }
        p.sub { color: #64748b; margin-top: 4px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; }
        .btn-logout { background: none; border: 1px solid #cbd5e1; color: #64748b; padding: 6px 14px; font-size: 0.85rem; }
        .btn-logout:hover { background: #f1f5f9; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Garmin Dashboard</h1>
            <p class="sub">Hallo, {{ user.name }}</p>
        </div>
        <form method="post" action="/logout">
            <button class="btn btn-logout" type="submit">Abmelden</button>
        </form>
    </div>

    <div class="card">
        <h2>Garmin Connect</h2>
        {% if user.garmin_linked %}
            <div class="status">
                <div class="dot green"></div>
                <span>Verknüpft mit <strong>{{ user.garmin_email }}</strong></span>
            </div>
            <br>
            <form method="post" action="/garmin/unlink">
                <button class="btn btn-danger" type="submit">Verknüpfung aufheben</button>
            </form>
        {% else %}
            <div class="status">
                <div class="dot grey"></div>
                <span>Kein Garmin Account verknüpft</span>
            </div>
            <br>
            <a class="btn btn-primary" href="/garmin/link">Garmin Account verknüpfen</a>
        {% endif %}
    </div>

    <div class="card">
        <h2>Dashboard</h2>
        <a class="btn btn-primary" href="/dashboard">Zum Dashboard →</a>
    </div>
</body>
</html>
