{% extends "base.html" %}
{% block title %}PulseBase{% endblock %}
{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="text-center max-w-sm w-full">
        <h1 class="text-3xl font-bold tracking-tight text-slate-100 mb-1">PulseBase</h1>
        <p class="text-slate-400 mb-8">Hallo, {{ user.name }}</p>

        <div class="card mb-4">
            {% if user.garmin_linked %}
            <div class="flex items-center gap-3 mb-4">
                <div class="w-2.5 h-2.5 rounded-full bg-green-400 shrink-0"></div>
                <span class="text-sm text-slate-300">Verknüpft mit <strong class="text-slate-100 font-medium">{{ user.garmin_email }}</strong></span>
            </div>
            <form method="post" action="/garmin/unlink">
                <button type="submit"
                        class="w-full py-2.5 rounded-xl bg-red-500/80 hover:bg-red-500 text-white text-sm font-medium transition-colors">
                    Verknüpfung aufheben
                </button>
            </form>
            {% else %}
            <div class="flex items-center gap-3 mb-4">
                <div class="w-2.5 h-2.5 rounded-full bg-slate-500 shrink-0"></div>
                <span class="text-sm text-slate-400">Kein Garmin Account verknüpft</span>
            </div>
            <a href="/garmin/link"
               class="block w-full py-2.5 text-center rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 text-sm font-semibold transition-colors">
                Garmin Account verknüpfen
            </a>
            {% endif %}
        </div>

        <a href="/dashboard"
           class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-900 text-sm font-semibold transition-colors">
            Zum Dashboard →
        </a>
    </div>
</div>
{% endblock %}
