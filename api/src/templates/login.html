<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Dashboard — Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 420px; margin: 80px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 1.6rem; margin-bottom: 4px; }
        p.sub { color: #64748b; margin-top: 4px; margin-bottom: 32px; }
        .card { background: #f8f9fa; border-radius: 12px; padding: 32px; }
        label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; margin-top: 16px; }
        input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #3b82f6; }
        .btn { display: block; width: 100%; padding: 11px; margin-top: 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .error { background: #fee2e2; color: #b91c1c; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; }
        .footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b; }
        .footer a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Garmin Dashboard</h1>
    <p class="sub">Melde dich an</p>

    <div class="card">
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required autofocus>

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required>

            <button class="btn" type="submit">Anmelden</button>
        </form>
    </div>

    <p class="footer">Noch kein Konto? <a href="/register">Registrieren</a></p>
</body>
</html>
