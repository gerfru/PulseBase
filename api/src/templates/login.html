<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBase — Anmelden</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrap">
        <h1 class="auth-brand">PulseBase</h1>
        <p class="auth-sub">Melde dich an</p>

        <div class="card">
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" required autofocus autocomplete="email">

                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <button class="btn btn-primary btn-block" type="submit" style="margin-top: var(--sp-6)">Anmelden</button>
            </form>
        </div>

        <p class="auth-footer">Noch kein Konto? <a href="/register">Registrieren</a></p>
    </div>
</body>
</html>
