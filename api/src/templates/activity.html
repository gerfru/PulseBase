<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseBase — Aktivität</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .act-header { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); }
        .act-back { font-size: .85rem; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .act-back:hover { color: var(--text); }
        .act-title { font-size: 1.4rem; font-weight: 700; color: var(--text); margin: 0; }
        .act-meta  { font-size: .9rem; color: var(--muted); }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--sp-3);
            padding: 0 var(--sp-4) var(--sp-4);
        }
        @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(6, 1fr); } }
        .content { padding: 0 var(--sp-4) var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-4); }
        @media (min-width: 640px) {
            .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }
        }
    </style>
</head>
<body>

    <div class="act-header">
        <a class="act-back" href="/dashboard">← Dashboard</a>
        <h1 class="act-title" id="act-title">—</h1>
        <div class="act-meta" id="act-meta">—</div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div class="content">

        <!-- Training Effect -->
        <div class="card" id="effect-card" style="display:none">
            <h2>Trainingswirkung</h2>
            <div id="effect-aerobic" class="effect-row">
                <span class="effect-name">Aerobe Wirkung</span>
                <div class="effect-bar"><div class="effect-fill" id="fill-aerobic" style="width:0%"></div></div>
                <span class="effect-val" id="val-aerobic">—</span>
            </div>
            <div id="effect-anaerobic" class="effect-row">
                <span class="effect-name">Anaerobe Wirkung</span>
                <div class="effect-bar"><div class="effect-fill" id="fill-anaerobic" style="width:0%"></div></div>
                <span class="effect-val" id="val-anaerobic">—</span>
            </div>
            <div id="training-status-row" style="display:none; margin-top: var(--sp-3);">
                <div class="kv-row">
                    <span class="kv-label">Trainingszustand</span>
                    <span id="training-status-badge"></span>
                </div>
            </div>
        </div>

        <!-- GPS Map -->
        <div class="card" id="map-card" style="display:none">
            <h2>GPS-Track</h2>
            <div id="map" class="map-container"></div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="card" id="hr-card" style="display:none">
                <h2>Herzfrequenz</h2>
                <div class="chart-wrap"><canvas id="hr-chart"></canvas></div>
            </div>
            <div class="card" id="pace-card" style="display:none">
                <h2 id="pace-title">Pace</h2>
                <div class="chart-wrap"><canvas id="pace-chart"></canvas></div>
            </div>
            <div class="card" id="elev-card" style="display:none">
                <h2>Höhenprofil</h2>
                <div class="chart-wrap"><canvas id="elev-chart"></canvas></div>
            </div>
            <div class="card" id="cadence-card" style="display:none">
                <h2>Kadenz</h2>
                <div class="chart-wrap"><canvas id="cadence-chart"></canvas></div>
            </div>
        </div>

    </div>

    <script src="/static/activity.js"></script>
</body>
</html>
