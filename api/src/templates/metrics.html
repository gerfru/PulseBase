{% extends "base.html" %}
{% block title %}PulseBase — Kennzahl{% endblock %}
{% block extra_head %}
<script nonce="{{ nonce }}" src="/static/vendor/chart.umd.min.js"></script>
{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-4 pb-12 flex flex-col gap-4">

    <a class="inline-flex items-center gap-1 text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-colors no-underline w-fit py-1" href="/dashboard">← Dashboard</a>

    <div class="card">
        <div class="text-[0.65rem] font-bold uppercase tracking-[.1em] text-emerald-700 dark:text-emerald-400 mb-1" id="metric-section"></div>
        <div class="flex items-start justify-between gap-2 flex-wrap mb-4">
            <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 m-0" id="metric-title">Lade…</h1>
            <a id="metric-help-link" href="/help" class="text-xs text-slate-600 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 no-underline transition-colors py-1" aria-label="Hilfe-Artikel für diese Metrik">? Hilfe-Artikel</a>
        </div>
        <div class="text-6xl font-extrabold leading-none tracking-tight text-slate-900 dark:text-slate-100" id="metric-value">—</div>
        <div class="text-sm text-slate-600 dark:text-slate-400 mt-2" id="metric-sub"></div>
        <p class="metric-summary-text" id="metric-summary" style="display:none"></p>
    </div>

    <div id="metric-recommendation" class="recommendation-block" style="display:none"></div>

    <div id="custom-html-block"></div>

    <div class="card" id="chart-card" style="display:none">
        <h2 id="chart-title">Verlauf</h2>
        <div class="chart-wrap-lg"><canvas id="metrics-chart"></canvas></div>
    </div>

    <div class="grid gap-3 [grid-template-columns:repeat(auto-fill,minmax(170px,1fr))]" id="metrics-kpis"></div>

</div>
{% endblock %}
{% block scripts %}
<script nonce="{{ nonce }}" src="/static/vendor/purify.min.js"></script>
<script nonce="{{ nonce }}" type="module" src="/static/metrics.js?v={{ v }}"></script>
{% endblock %}
