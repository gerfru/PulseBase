[project]
name = "pulsebase-ml"
version = "1.4.0"
requires-python = ">=3.12"

dependencies = [
    "asyncpg>=0.31.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "apscheduler>=3.11.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "numpy>=2.0.0",
    "joblib>=1.4.0",
    "structlog>=24.4.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/db/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
]
fail_under = 80
