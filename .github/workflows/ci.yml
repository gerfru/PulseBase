name: CI

# Nur auf PRs — GitHub testet beim pull_request-Event bereits den Merge-Commit
# (main + Branch). Ein separater push:[main]-Lauf nach dem Merge wäre bei
# stets aktuellem Branch redundant; Branch-Protection "Require branches to be
# up to date before merging" sichert das ab. release-please.yml triggert
# weiterhin eigenständig auf push:[main].
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-size:
    name: PR Size Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if PR adds more than 400 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff "origin/$BASE_REF"...HEAD \
            -- . ':(exclude)*.lock' ':(exclude)*-lock.json' ':(exclude)*.lockb' \
               ':(exclude)*.md' ':(exclude)LICENSE' ':(exclude)*/data/*.json' \
               ':(exclude)*/tests/*' ':(exclude)*/test_*.py' \
            | grep -cE '^\+[^+]' || echo 0)
          echo "Lines added (excl. lockfiles): $ADDED"
          if [ "$ADDED" -gt 400 ]; then
            echo "::error::PR zu groß (${ADDED} Zeilen hinzugefügt, Limit: 400) — bitte aufteilen."
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check .
          version: "0.11.4"

  js-lint:
    name: JS Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: "2.4.16"
      - run: biome ci api/src/static/

  security:
    name: Security
    # Release-PRs (release-please) ändern nur CHANGELOG/version.txt/Manifest —
    # die schweren Jobs (security, trivy, e2e, smoke) bringen dort keinen Mehrwert.
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv + pip-audit
        run: pip install pip-audit==2.8.0 uv==0.7.8
      - name: pip-audit api
        run: |
          uv export --frozen --no-hashes --directory api/ -o /tmp/req-api.txt
          pip-audit -r /tmp/req-api.txt
      - name: pip-audit sync-service
        run: |
          uv export --frozen --no-hashes --directory sync-service/ -o /tmp/req-sync.txt
          pip-audit -r /tmp/req-sync.txt
      - name: pip-audit ml-service
        run: |
          uv export --frozen --no-hashes --directory ml-service/ -o /tmp/req-ml.txt
          pip-audit -r /tmp/req-ml.txt
      - name: bandit
        run: |
          pip install bandit==1.8.3
          bandit -r api/src/ sync-service/src/ ml-service/src/ -q
      - name: semgrep
        run: |
          pip install semgrep==1.164.0
          semgrep scan --error --config p/python --config p/owasp-top-ten \
            api/src/ sync-service/src/ ml-service/src/
      - name: SBOM (CycloneDX via syft)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          artifact-name: pulsebase-sbom.cdx.json
          output-file: pulsebase-sbom.cdx.json
          format: cyclonedx-json

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: mypy api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases

  trivy:
    name: Trivy Image Scan
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build api image
        run: docker build -t pulsebase-api:ci api/
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-api:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: api/.trivyignore
          format: table
          output: trivy-api.txt
      - name: Upload api Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-api
          path: trivy-api.txt
          retention-days: 90
      - name: Build sync image
        run: docker build -t pulsebase-sync:ci sync-service/
      - name: Scan sync
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-sync:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: sync-service/.trivyignore
          format: table
          output: trivy-sync.txt
      - name: Upload sync Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-sync
          path: trivy-sync.txt
          retention-days: 90
      - name: Build ml image
        run: docker build -t pulsebase-ml:ci ml-service/
      - name: Scan ml
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-ml:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ml-service/.trivyignore
          format: table
          output: trivy-ml.txt
      - name: Upload ml Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-ml
          path: trivy-ml.txt
          retention-days: 90
      - name: Build backup image
        run: docker build -t pulsebase-backup:ci backup/
      - name: Scan backup
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-backup:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: backup/.trivyignore
          format: table
          output: trivy-backup.txt
      - name: Upload backup Trivy results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-backup
          path: trivy-backup.txt
          retention-days: 90

  js-test:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: api
      - run: pnpm run test:coverage
        working-directory: api

  check-e2e-secrets:
    name: Check E2E Secrets
    if: github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Detect configured secrets
        id: check
        env:
          E2E_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
        run: |
          if [ -n "$E2E_EMAIL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_TEST_EMAIL not set — E2E tests skipped (fork or unconfigured repo). See docs/development.md."
          fi

  e2e:
    name: E2E Tests
    needs: [lint, js-lint, security, typecheck, test, js-test, trivy, check-e2e-secrets]
    # !cancelled()                   = läuft trotz Fehlern, respektiert manuellen Abbruch.
    # check-e2e-secrets.available    = übersprungen in Forks/PRs ohne konfigurierte Secrets
    #                                  (skipped zählt bei ci-ok nicht als Fehler).
    if: ${{ !cancelled() && needs.check-e2e-secrets.outputs.available == 'true' && github.head_ref != 'release-please--branches--main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare env files
        run: |
          cp env/.env.example env/.env
          cp env/.env.app.example env/.env.app
          cp env/.env.api.example env/.env.api
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" env/.env.api
          sed -i "s|^FERNET_KEY=.*|FERNET_KEY=$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" env/.env.app
          sed -i "s|^HTTPS_ONLY=.*|HTTPS_ONLY=false|" env/.env.api

      - name: Start test stack
        run: docker compose --env-file env/.env --env-file env/.env.app -f deploy/docker-compose.test.yml up -d --wait

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install api dev deps
        run: uv sync --frozen --extra dev
        working-directory: api

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
        working-directory: api

      - name: Create CI test user
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
          DB_PORT: "5434"
        run: |
          export DB_USER=$(grep '^DB_USER=' ../env/.env | cut -d= -f2-)
          export DB_PASSWORD=$(grep '^DB_PASSWORD=' ../env/.env | cut -d= -f2-)
          uv run python tests/e2e/create_ci_user.py

      - name: Run E2E smoke tests
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
        run: uv run pytest tests/e2e/ -v

      - name: Stop test stack
        if: always()
        run: docker compose --env-file env/.env --env-file env/.env.app -f deploy/docker-compose.test.yml down

  deploy-public-smoke:
    name: Public Deployment Smoke
    needs: [lint, typecheck, test]
    if: ${{ !cancelled() && github.head_ref != 'release-please--branches--main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare env files
        run: |
          cp env/.env.example env/.env
          cp env/.env.app.example env/.env.app
          cp env/.env.api.example env/.env.api
          cp env/.env.sync.example env/.env.sync
          cp env/.env.ml.example env/.env.ml
          cp env/.env.public.example env/.env.public
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" env/.env.api
          sed -i "s|^FERNET_KEY=.*|FERNET_KEY=$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" env/.env.app
          sed -i "s|^HTTPS_ONLY=.*|HTTPS_ONLY=false|" env/.env.api

      - name: Validate public overlay (api decoupled from proxy network)
        run: |
          json=$(docker compose --env-file env/.env --env-file env/.env.app \
            -f docker-compose.yml -f deploy/docker-compose.public.yml config --format json)
          # Form-agnostic (networks may render as map or list): assert api's networks
          # do NOT reference proxy, but DO reference internal.
          echo "$json" | jq -e '(.services.api.networks | tostring | test("proxy")) | not' >/dev/null \
            || { echo "::error::public overlay: api must NOT attach to the proxy network"; exit 1; }
          echo "$json" | jq -e '.services.api.networks | tostring | test("internal")' >/dev/null \
            || { echo "::error::public overlay: api must attach to the internal network"; exit 1; }
          echo "$json" | jq -e '.services.caddy' >/dev/null \
            || { echo "::error::public overlay: caddy service missing"; exit 1; }
          echo "✓ api on internal only (no proxy); caddy present"

      - name: Bring up public stack (HTTP-only Caddy, no ACME)
        run: |
          # flyway is a one-shot migration container (exits 0) — not in the wait set;
          # api pulls it via `depends_on: service_completed_successfully`.
          docker compose --env-file env/.env --env-file env/.env.app \
            -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.public.ci.yml \
            up -d --build --wait db api caddy

      - name: Smoke — reach app through Caddy
        run: |
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status"'
          curl -fsS http://localhost:8080/ready  | tee /dev/stderr | grep -q '"status"'
          echo "✓ Caddy → api routing works (health + ready 200)"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose --env-file env/.env --env-file env/.env.app \
            -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.public.ci.yml logs --tail=80

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file env/.env --env-file env/.env.app \
            -f docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.public.ci.yml down -v

  backup-smoke:
    name: Backup Smoke
    needs: [lint, typecheck, test]
    if: ${{ !cancelled() && github.head_ref != 'release-please--branches--main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare env files
        run: |
          for n in "" .app .api .sync .ml; do
            cp "env/.env${n}.example" "env/.env${n}"
          done
          grep -E '^DB_(USER|PASSWORD)=' env/.env >> "$GITHUB_ENV"

      - name: Build backup image
        run: docker build -t pulsebase-backup:ci backup/

      - name: Bring up test DB
        run: |
          docker compose --env-file env/.env --env-file env/.env.app \
            -f deploy/docker-compose.test.yml up -d --wait db-test

      - name: Run migrations (blocks until complete)
        run: |
          docker compose --env-file env/.env --env-file env/.env.app \
            -f deploy/docker-compose.test.yml run --rm flyway-test

      - name: Seed sentinel row
        run: |
          docker exec pulsebase-db-test psql -U "$DB_USER" -d garmin_test -c \
            "INSERT INTO users (name, email) VALUES ('smoke', 'smoke@example.com');"

      - name: Prepare backup dir + ephemeral age key
        run: |
          mkdir -p bk && chmod 777 bk
          docker run --rm -v "$PWD/bk:/w" -w /w pulsebase-backup:ci age-keygen -o ci.key 2> keygen.err
          echo "AGE_RECIPIENT=$(grep -o 'age1[a-z0-9]*' keygen.err | head -1)" >> "$GITHUB_ENV"

      - name: Backup via image (pg_dump → age)
        run: |
          docker run --rm --network host -v "$PWD/bk:/backups" \
            -e PGHOST=localhost -e PGPORT=5434 -e PGUSER="$DB_USER" -e PGPASSWORD="$DB_PASSWORD" \
            -e PGDATABASE=garmin_test -e AGE_RECIPIENT="$AGE_RECIPIENT" \
            pulsebase-backup:ci /scripts/backup.sh
          ls -la bk/*.dump.age

      - name: Restore via image (age → pre/post_restore → pg_restore) + assert
        run: |
          out=$(docker run --rm --network host -v "$PWD/bk:/backups" \
            -e AGE_IDENTITY=/backups/ci.key \
            -e PGHOST=localhost -e PGPORT=5434 -e PGUSER="$DB_USER" -e PGPASSWORD="$DB_PASSWORD" \
            pulsebase-backup:ci /scripts/restore.sh latest restore_check)
          echo "$out"
          users=$(echo "$out" | tail -n1)
          if [ "$users" -ge 1 ]; then
            echo "✓ pg_dump → age → decrypt → pre/post_restore → pg_restore verified ($users user)"
          else
            echo "::error::restore assertion failed (users=$users)"; exit 1
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file env/.env --env-file env/.env.app \
            -f deploy/docker-compose.test.yml down -v

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: pytest api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run pytest -v --ignore=tests/e2e --cov=src --cov-fail-under=80
        env:
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=  # pragma: allowlist secret
      - name: pytest sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=80
      - name: pytest ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=80

  ci-ok:
    name: CI OK (All Green Gate)
    runs-on: ubuntu-latest
    if: always()
    needs: [check-pr-size, lint, js-lint, security, typecheck, test, js-test, check-e2e-secrets, e2e, deploy-public-smoke, backup-smoke, trivy]
    steps:
      - name: All checks passed
        run: |
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."
