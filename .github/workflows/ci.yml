name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-size:
    name: PR Size Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Fail if PR adds more than 400 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff "origin/$BASE_REF"...HEAD \
            -- . ':(exclude)*.lock' ':(exclude)*-lock.json' ':(exclude)*.lockb' \
            | grep -cP '^\+' || echo 0)
          echo "Lines added (excl. lockfiles): $ADDED"
          if [ "$ADDED" -gt 400 ]; then
            echo "::error::PR zu groß (${ADDED} Zeilen hinzugefügt, Maximum: 400)"
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: format --check .
          version: "0.11.4"

  js-lint:
    name: JS Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: "2.4.16"
      - run: biome ci api/src/static/

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: pip-audit api
        run: |
          pip install pip-audit
          pip-audit api/
      - name: pip-audit sync-service
        run: pip-audit sync-service/
      - name: pip-audit ml-service
        run: pip-audit ml-service/
      - name: bandit
        run: |
          pip install bandit
          bandit -r api/src/ sync-service/src/ ml-service/src/ -q
      - name: semgrep
        run: |
          pip install semgrep
          semgrep scan --error --config p/python --config p/owasp-top-ten \
            api/src/ sync-service/src/ ml-service/src/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: mypy api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build api image
        run: docker build -t garmin-api:ci api/
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-api:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build sync image
        run: docker build -t garmin-sync:ci sync-service/
      - name: Scan sync
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-sync:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build ml image
        run: docker build -t garmin-ml:ci ml-service/
      - name: Scan ml
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-ml:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  js-test:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: api
      - run: pnpm run test:coverage
        working-directory: api

  e2e:
    name: E2E Tests
    needs: [test, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare env files
        run: |
          cp env/.env.example env/.env
          cp env/.env.api.example env/.env.api
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" env/.env.api
          sed -i "s|^FERNET_KEY=.*|FERNET_KEY=$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" env/.env
          sed -i "s|^HTTPS_ONLY=.*|HTTPS_ONLY=false|" env/.env.api

      - name: Start test stack
        run: docker compose --env-file env/.env -f docker-compose.test.yml up -d --wait

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install api dev deps
        run: uv sync --frozen --extra dev
        working-directory: api

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
        working-directory: api

      - name: Create CI test user
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
          DB_PORT: "5434"
        run: |
          export DB_USER=$(grep ^DB_USER ../env/.env | cut -d= -f2)
          export DB_PASSWORD=$(grep ^DB_PASSWORD ../env/.env | cut -d= -f2)
          uv run python tests/e2e/create_ci_user.py

      - name: Run E2E smoke tests
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
        run: uv run pytest tests/e2e/ -v

      - name: Stop test stack
        if: always()
        run: docker compose --env-file env/.env -f docker-compose.test.yml down

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: pytest api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run pytest -v --ignore=tests/e2e --cov=src --cov-fail-under=70
        env:
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - name: pytest sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=50
      - name: pytest ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=30
