name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-pr-size:
    name: PR Size Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Fail if PR adds more than 400 lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff "origin/$BASE_REF"...HEAD \
            -- . ':(exclude)*.lock' ':(exclude)*-lock.json' ':(exclude)*.lockb' \
               ':(exclude)*.md' ':(exclude)*/data/*.json' \
            | grep -cE '^\+[^+]' || echo 0)
          echo "Lines added (excl. lockfiles): $ADDED"
          if [ "$ADDED" -gt 400 ]; then
            echo "::error::PR zu groß (${ADDED} Zeilen hinzugefügt, Maximum: 400)"
            exit 1
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: format --check .
          version: "0.11.4"

  js-lint:
    name: JS Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: "2.4.16"
      - run: biome ci api/src/static/

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"
      - name: Install uv + pip-audit
        run: pip install pip-audit==2.8.0 uv==0.7.8
      - name: pip-audit api
        run: |
          uv export --frozen --no-hashes --directory api/ -o /tmp/req-api.txt
          pip-audit -r /tmp/req-api.txt
      - name: pip-audit sync-service
        run: |
          uv export --frozen --no-hashes --directory sync-service/ -o /tmp/req-sync.txt
          pip-audit -r /tmp/req-sync.txt
      - name: pip-audit ml-service
        run: |
          uv export --frozen --no-hashes --directory ml-service/ -o /tmp/req-ml.txt
          pip-audit -r /tmp/req-ml.txt
      - name: bandit
        run: |
          pip install bandit==1.8.3
          bandit -r api/src/ sync-service/src/ ml-service/src/ -q
      - name: semgrep
        run: |
          pip install semgrep==1.164.0
          semgrep scan --error --config p/python --config p/owasp-top-ten \
            api/src/ sync-service/src/ ml-service/src/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: mypy api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: mypy ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run mypy src/ --ignore-missing-imports --explicit-package-bases

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build api image
        run: docker build -t pulsebase-api:ci api/
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-api:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-api.txt
      - name: Upload api Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-api
          path: trivy-api.txt
          retention-days: 90
      - name: Build sync image
        run: docker build -t pulsebase-sync:ci sync-service/
      - name: Scan sync
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-sync:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-sync.txt
      - name: Upload sync Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sync
          path: trivy-sync.txt
          retention-days: 90
      - name: Build ml image
        run: docker build -t pulsebase-ml:ci ml-service/
      - name: Scan ml
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulsebase-ml:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-ml.txt
      - name: Upload ml Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-ml
          path: trivy-ml.txt
          retention-days: 90

  js-test:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: api
      - run: pnpm run test:coverage
        working-directory: api

  e2e:
    name: E2E Tests
    needs: [lint, js-lint, security, typecheck, test, js-test, trivy, check-pr-size]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare env files
        run: |
          cp env/.env.example env/.env
          cp env/.env.app.example env/.env.app
          cp env/.env.api.example env/.env.api
          sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" env/.env.api
          sed -i "s|^FERNET_KEY=.*|FERNET_KEY=$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" env/.env.app
          sed -i "s|^HTTPS_ONLY=.*|HTTPS_ONLY=false|" env/.env.api

      - name: Start test stack
        run: docker compose --env-file env/.env --env-file env/.env.app -f docker-compose.test.yml up -d --wait

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install api dev deps
        run: uv sync --frozen --extra dev
        working-directory: api

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps
        working-directory: api

      - name: Validate test secrets
        run: |
          if [ -z "$TEST_EMAIL" ] || [ -z "$TEST_PASSWORD" ]; then
            echo "::error::E2E_TEST_EMAIL and E2E_TEST_PASSWORD must be set as repository secrets"
            exit 1
          fi
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret

      - name: Create CI test user
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
          DB_PORT: "5434"
        run: |
          export DB_USER=$(grep '^DB_USER=' ../env/.env | cut -d= -f2-)
          export DB_PASSWORD=$(grep '^DB_PASSWORD=' ../env/.env | cut -d= -f2-)
          uv run python tests/e2e/create_ci_user.py

      - name: Run E2E smoke tests
        working-directory: api
        env:
          TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}  # pragma: allowlist secret
        run: uv run pytest tests/e2e/ -v

      - name: Stop test stack
        if: always()
        run: docker compose --env-file env/.env --env-file env/.env.app -f docker-compose.test.yml down

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: pytest api
        working-directory: api
        run: uv sync --frozen --extra dev && uv run pytest -v --ignore=tests/e2e --cov=src --cov-fail-under=70
        env:
          FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=  # pragma: allowlist secret
      - name: pytest sync-service
        working-directory: sync-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=70
      - name: pytest ml-service
        working-directory: ml-service
        run: uv sync --frozen --extra dev && uv run pytest -v --cov=src --cov-fail-under=80

  ci-ok:
    name: CI OK (All Green Gate)
    runs-on: ubuntu-latest
    if: always()
    needs: [check-pr-size, lint, js-lint, security, typecheck, test, js-test, e2e, trivy]
    steps:
      - name: All checks passed
        run: |
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"failure"|"cancelled"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed."
