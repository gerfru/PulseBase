name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
          version: "0.11.4"

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit api
        run: |
          pip install pip-audit
          pip-audit api/
      - name: pip-audit sync-service
        run: pip-audit sync-service/
      - name: bandit
        run: |
          pip install bandit
          bandit -r api/src/ sync-service/src/ -q

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install api + mypy
        run: pip install -e api/ mypy --quiet
      - name: mypy api
        working-directory: api
        run: mypy src/ --ignore-missing-imports
      - name: Install sync + mypy
        run: pip install -e sync-service/ mypy --quiet
      - name: mypy sync-service
        working-directory: sync-service
        run: mypy src/ --ignore-missing-imports

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build api image
        run: docker build -t garmin-api:ci api/
      - name: Scan api
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: garmin-api:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Build sync image
        run: docker build -t garmin-sync:ci sync-service/
      - name: Scan sync
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: garmin-sync:ci
          exit-code: '1'
          severity: CRITICAL,HIGH

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -v
