name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .
          version: "0.11.4"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit api
        run: |
          pip install pip-audit
          pip-audit -p api/pyproject.toml
      - name: pip-audit sync-service
        run: pip-audit -p sync-service/pyproject.toml

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -v
