name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: check .
          version: "0.11.4"
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: format --check .
          version: "0.11.4"

  js-lint:
    name: JS Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: biomejs/setup-biome@v2
        with:
          version: "2.4.16"
      - run: biome ci api/src/static/

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: pip-audit api
        run: |
          pip install pip-audit
          pip-audit api/
      - name: pip-audit sync-service
        run: pip-audit sync-service/
      - name: pip-audit ml-service
        run: pip-audit ml-service/
      - name: bandit
        run: |
          pip install bandit
          bandit -r api/src/ sync-service/src/ ml-service/src/ -q

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install api + mypy
        run: pip install -e api/ mypy --quiet
      - name: mypy api
        working-directory: api
        run: mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: Install sync + mypy
        run: pip install -e sync-service/ mypy --quiet
      - name: mypy sync-service
        working-directory: sync-service
        run: mypy src/ --ignore-missing-imports --explicit-package-bases
      - name: Install ml + mypy
        run: pip install -e ml-service/ mypy --quiet
      - name: mypy ml-service
        working-directory: ml-service
        run: mypy src/ --ignore-missing-imports --explicit-package-bases

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build api image
        run: docker build -t garmin-api:ci api/
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-api:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build sync image
        run: docker build -t garmin-sync:ci sync-service/
      - name: Scan sync
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-sync:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Build ml image
        run: docker build -t garmin-ml:ci ml-service/
      - name: Scan ml
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: garmin-ml:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  js-test:
    name: JS Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run test:coverage
        working-directory: api

  test:
    name: Tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: pytest api
        working-directory: api
        run: pip install -e ".[dev]" && pytest -v --ignore=tests/e2e
      - name: pytest sync-service
        working-directory: sync-service
        run: pip install -e ".[dev]" && pytest -v
      - name: pytest ml-service
        working-directory: ml-service
        run: pip install -e ".[dev]" && pytest -v
