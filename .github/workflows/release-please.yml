name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        with:
          release-type: simple
          # git-filter-repo rewrote all SHAs → tags no longer point to commits on
          # main → release-please finds 0 releases and falls back to all history.
          # Force v1.3.0 once; remove this line after the release PR is merged.
          release-as: 1.3.0
