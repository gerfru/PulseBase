[project]
name = "pulsebase-garmin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.5",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsebase_garmin"]
