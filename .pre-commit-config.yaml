repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev, --branch, master]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, api/src/, sync-service/src/, ml-service/src/]
        pass_filenames: false
        files: ^(api|sync-service|ml-service)/src/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check (JS lint + format)
        entry: npx --yes @biomejs/biome@2.4.16 check --write api/src/static/
        language: node
        pass_filenames: false
        files: ^api/src/static/.*\.js$

      - id: mypy-api
        name: mypy api
        entry: mypy
        language: python
        additional_dependencies: [mypy, asyncpg-stubs, types-python-dateutil]
        args: [api/src/, --ignore-missing-imports]
        pass_filenames: false
        files: ^api/src/
      - id: mypy-sync
        name: mypy sync-service
        entry: mypy
        language: python
        additional_dependencies: [mypy, asyncpg-stubs, types-python-dateutil]
        args: [sync-service/src/, --ignore-missing-imports]
        pass_filenames: false
        files: ^sync-service/src/
      - id: mypy-ml
        name: mypy ml-service
        entry: mypy
        language: python
        additional_dependencies: [mypy, asyncpg-stubs, scikit-learn, scipy, numpy, joblib]
        args: [ml-service/src/, --ignore-missing-imports]
        pass_filenames: false
        files: ^ml-service/src/
