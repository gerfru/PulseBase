services:

  db:
    image: timescale/timescaledb:2.26.4-pg16@sha256:15e00162766bd6f0019afaad4e57b850dcf882de5909bd7633899eebd4c03d57
    container_name: garmin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest@sha256:20aa05a629aa11d4b1211c6622baca9e0b90d603f64a6dc15e8da6547f3754fb
    container_name: garmin-flyway
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/garmin
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
      - FLYWAY_PLACEHOLDERS_DB_APP_USER=${DB_APP_USER}
      - FLYWAY_PLACEHOLDERS_DB_APP_PASSWORD=${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  traefik:
    image: traefik:v3.3.4@sha256:cc11989f418e2cfe5e60fc40c92c1813be847f58eda15eced7d5ac890255ad9e
    container_name: garmin-traefik
    restart: unless-stopped
    profiles:
      - standalone
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  api:
    build: ./api
    container_name: garmin-api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${HOST_IP}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.priority=1"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      HTTPS_ONLY: ${HTTPS_ONLY:-true}
      TRIMP_LOOKBACK_DAYS: ${TRIMP_LOOKBACK_DAYS:-7}
      TRIMP_FORECAST_DAYS: ${TRIMP_FORECAST_DAYS:-7}
    volumes:
      - garmin-tokens:/app/tokens
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sync-service:
    build: ./sync-service
    container_name: garmin-sync
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SYNC_HOUR: ${SYNC_HOUR:-6}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-30}
      SYNC_DAILY_DAYS: ${SYNC_DAILY_DAYS:-2}
    volumes:
      - garmin-tokens:/app/tokens
    networks:
      - internal

  ml-service:
    build: ./ml-service
    container_name: garmin-ml
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      MODEL_DIR: /app/models
      ML_INFER_HOUR: ${ML_INFER_HOUR:-7}
    volumes:
      - ml-models:/app/models
    networks:
      - internal

volumes:
  timescale-data:
  garmin-tokens:
  ml-models:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
