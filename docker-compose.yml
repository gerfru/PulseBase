services:

  db:
    image: timescale/timescaledb:2.27.1-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
    container_name: pulsebase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flyway:
    image: flyway/flyway:11@sha256:782c5c207ffb5ac6336139fda4f4295bd9991ef63ad36919406d4268740069bb
    container_name: pulsebase-flyway
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/garmin
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
      - FLYWAY_PLACEHOLDERS_DB_APP_USER=${DB_APP_USER}
      - FLYWAY_PLACEHOLDERS_DB_APP_PASSWORD=${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  traefik:
    image: traefik:v3.3.4@sha256:cc11989f418e2cfe5e60fc40c92c1813be847f58eda15eced7d5ac890255ad9e
    container_name: pulsebase-traefik
    restart: unless-stopped
    profiles:
      - standalone
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./api
    container_name: pulsebase-api
    restart: unless-stopped
    stop_grace_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${HOST_IP}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.priority=1"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    env_file:
      - env/.env.app
      - env/.env.api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sync-service:
    build: ./sync-service
    container_name: pulsebase-sync
    restart: unless-stopped
    stop_grace_period: 90s
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file:
      - env/.env.app
      - env/.env.sync
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    networks:
      - internal
    healthcheck:
      test: ["CMD", "find", "/tmp/sync_alive", "-mmin", "-2"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ml-service:
    build: ./ml-service
    container_name: pulsebase-ml
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file:
      - env/.env.app
      - env/.env.ml
    environment:
      MODEL_DIR: /app/models
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    volumes:
      - ml-models:/app/models
    networks:
      - internal
    healthcheck:
      test: ["CMD", "find", "/tmp/ml_alive", "-mmin", "-2"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescale-data:
  ml-models:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
