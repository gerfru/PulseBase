services:

  db:
    image: timescale/timescaledb:2.27.2-pg16@sha256:51ac20ec295699c05573adf896e2449d8b3a026223a951905d5763687409d7d4
    container_name: pulsebase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - internal
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flyway:
    image: flyway/flyway:12@sha256:4c7f14b4eea7a628c954a6905dfb25a8815e46a98d21a481f8160dd1eb04c7a3
    container_name: pulsebase-flyway
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/garmin
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
      - FLYWAY_PLACEHOLDERS_DB_APP_USER=${DB_APP_USER}
      - FLYWAY_PLACEHOLDERS_DB_APP_PASSWORD=${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build: ./api
    container_name: pulsebase-api
    restart: unless-stopped
    stop_grace_period: 45s
    labels:
      - "monitoring=true"
    env_file:
      - env/.env.app
      - env/.env.api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sync-service:
    build: ./sync-service
    container_name: pulsebase-sync
    restart: unless-stopped
    stop_grace_period: 120s
    labels:
      - "monitoring=true"
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file:
      - env/.env.app
      - env/.env.sync
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ml-service:
    build: ./ml-service
    container_name: pulsebase-ml
    restart: unless-stopped
    stop_grace_period: 120s
    labels:
      - "monitoring=true"
    depends_on:
      flyway:
        condition: service_completed_successfully
    env_file:
      - env/.env.app
      - env/.env.ml
    environment:
      MODEL_DIR: /app/models
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
    volumes:
      - ml-models:/app/models
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.00'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescale-data:
  ml-models:

networks:
  internal:
    driver: bridge
  proxy:
    external: true  # must exist: docker network create proxy
