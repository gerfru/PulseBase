services:

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: garmin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    container_name: garmin-flyway
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/garmin
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
    depends_on:
      db:
        condition: service_healthy

  traefik:
    image: traefik:v3
    container_name: garmin-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    build: ./api
    container_name: garmin-api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${HOST_IP}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.priority=1"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - garmin-tokens:/app/tokens
    depends_on:
      flyway:
        condition: service_completed_successfully

  sync-service:
    build: ./sync-service
    container_name: garmin-sync
    restart: unless-stopped
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: garmin
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SYNC_HOUR: ${SYNC_HOUR:-6}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-30}
    volumes:
      - garmin-tokens:/app/tokens

volumes:
  timescale-data:
  garmin-tokens:
