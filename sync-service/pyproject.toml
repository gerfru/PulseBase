[project]
name = "garmin-sync"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "garminconnect>=0.3.3",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "apscheduler>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
