[project]
name = "pulsebase-sync"
version = "1.7.0"
requires-python = ">=3.12"

dependencies = [
    "pulsebase-garmin",
    "pylibrelinkup>=0.10.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "apscheduler>=3.11.2",
    "cryptography>=50.0.0",
    "structlog>=24.4.0",
    "tenacity>=8.2.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
pulsebase-garmin = { path = "../packages/pulsebase_garmin" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
]
fail_under = 80
