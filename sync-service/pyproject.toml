[project]
name = "garmin-sync"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "garminconnect>=0.3.3",
    "pylibrelinkup>=0.10.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "apscheduler>=3.11.2",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
