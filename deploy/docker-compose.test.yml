services:

  db-test:
    image: timescale/timescaledb:2.28.0-pg16@sha256:68faf0bca42125ff98228a8f5a379bcf0ac588d8156f716be8aaf9befd65857f
    container_name: pulsebase-db-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: garmin_test
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d garmin_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-internal
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flyway-test:
    image: flyway/flyway:12@sha256:4c7f14b4eea7a628c954a6905dfb25a8815e46a98d21a481f8160dd1eb04c7a3
    container_name: pulsebase-flyway-test
    command: migrate
    volumes:
      - ../db/migrations:/flyway/sql
    environment:
      - FLYWAY_URL=jdbc:postgresql://db-test:5432/garmin_test
      - FLYWAY_USER=${DB_USER}
      - FLYWAY_PASSWORD=${DB_PASSWORD}
      - FLYWAY_CONNECT_RETRIES=10
      - FLYWAY_MIXED=true
      - FLYWAY_PLACEHOLDERS_DB_APP_USER=${DB_APP_USER}
      - FLYWAY_PLACEHOLDERS_DB_APP_PASSWORD=${DB_APP_PASSWORD}
      - FLYWAY_PLACEHOLDERS_DB_SYNC_USER=${DB_SYNC_USER}
      - FLYWAY_PLACEHOLDERS_DB_SYNC_PASSWORD=${DB_SYNC_PASSWORD}
      - FLYWAY_PLACEHOLDERS_DB_ML_USER=${DB_ML_USER}
      - FLYWAY_PLACEHOLDERS_DB_ML_PASSWORD=${DB_ML_PASSWORD}
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-test:
    build: ../api
    container_name: pulsebase-api-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ../env/.env.app
      - ../env/.env.api
    environment:
      DB_HOST: db-test
      DB_PORT: 5432
      DB_NAME: garmin_test
      HTTPS_ONLY: "false"
      RESEND_API_KEY: ""
    depends_on:
      flyway-test:
        condition: service_completed_successfully
    networks:
      - test-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  test-internal:
    driver: bridge
